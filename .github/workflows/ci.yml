name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# CI only builds and tests — no writes to the repo, releases, or packages.
permissions:
  contents: read

jobs:
  image-multiarch:
    # Build-only assertion that the operator image builds for every published
    # platform. Deliberately sets up buildx WITHOUT QEMU: the Dockerfile builder
    # is pinned to $BUILDPLATFORM and Go cross-compiles via GOARCH, so both legs
    # must build natively on this amd64 runner with no emulation. If the
    # --platform=$BUILDPLATFORM pin regresses, the arm64 leg fails here (exec
    # format error) instead of silently breaking the tag-release publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3.3.0
      - name: Build multi-arch image (no push, no QEMU)
        run: docker buildx build --platform linux/amd64,linux/arm64 -t etcd-operator:buildtest .

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: codegen drift
        # If a contributor edits an API type or +kubebuilder:rbac markers
        # without re-running codegen, this gate catches it before the chart's
        # CRDs (charts/etcd-operator/crd-bases), manager RBAC rules
        # (charts/etcd-operator/files/manager-role-rules.yaml), or deepcopy ship
        # out of sync. Runs before `make test` so the as-committed state of
        # generated files is what we check.
        run: |
          make generate manifests
          if ! git diff --quiet --exit-code; then
            echo "::error::codegen is out of date; run 'make generate manifests' and commit the result"
            git --no-pager diff
            exit 1
          fi

      - name: make test
        # `make test` runs fmt, vet, downloads envtest assets via
        # setup-envtest, exports KUBEBUILDER_ASSETS, and runs the whole
        # suite — including the CEL envtest cases in api/v1alpha2
        # which silently skip when KUBEBUILDER_ASSETS is unset.
        run: make test

  chart:
    # The chart is the single source of truth for the install, and until this
    # job existed nothing ran its tests: charts/etcd-operator/tests/ was written
    # and then never executed, in CI or anywhere else. A chart that renders is
    # not a chart that renders correctly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.4'

      - name: Install helm-unittest
        # --verify=false: the plugin repo publishes no provenance, and helm
        # refuses to install an unverifiable plugin without it.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: helm lint
        run: make helm-lint

      - name: helm unittest
        run: make helm-test

  security:
    # The supply chain was assembled from one end only: docker-publish.yml
    # produces an SBOM and a cosign signature, so a consumer can verify WHAT
    # shipped and WHO built it — but nothing ever asked whether what shipped
    # contains known vulnerabilities. Signing a vulnerable image proves its
    # provenance, not its safety.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Reachability-filtered: govulncheck reports a CVE only when the
        # vulnerable symbol is actually callable from this code, so a finding
        # means this operator is affected rather than that some dependency
        # published an advisory. That is what makes it cheap enough to gate on.
        #
        # Gating. The module-level findings this check first surfaced were
        # fixed by bumping grpc, x/net and x/text; the standard-library ones
        # went with the toolchain bump to go1.26.8 (go.mod `toolchain` and the
        # Dockerfile base image move together — the binary in the image is
        # what actually ships). A fresh finding here means this operator calls
        # a vulnerable symbol: bump the module or the toolchain, do not mute.
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false

      - name: Trivy (dependency CVEs)
        # ignore-unfixed keeps this actionable: a CRITICAL with no released fix
        # cannot be resolved from this repository, and a pipeline that stays red
        # for something nobody can act on stops being read.
        #
        # vuln only. The misconfig scanner would also lint every manifest under
        # charts/, and its Kubernetes ruleset flags shapes this chart chooses on
        # purpose — so it needs a reviewed .trivyignore before it can run at all,
        # not a switch flipped here.
        #
        # Not gating yet, for the same reason as govulncheck above: unlike
        # govulncheck this check is not reachability-filtered, so it reports a
        # CVE in any dependency whether or not this operator can reach it.
        # Watch what it actually reports for a few runs, write the ignore file,
        # then drop continue-on-error.
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
