---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: etcdsnapshotpolicies.etcd-operator.cozystack.io
spec:
  group: etcd-operator.cozystack.io
  names:
    categories:
    - etcd
    kind: EtcdSnapshotPolicy
    listKind: EtcdSnapshotPolicyList
    plural: etcdsnapshotpolicies
    shortNames:
    - etcdsp
    singular: etcdsnapshotpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.schedule.cron
      name: Schedule
      type: string
    - jsonPath: .spec.schedule.timezone
      name: Timezone
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .status.lastScheduleTime
      name: Last Schedule
      type: date
    - jsonPath: .status.lastSuccessfulTime
      name: Last Successful
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          EtcdSnapshotPolicy is the Schema for the etcdsnapshotpolicies API. It stamps
          out EtcdSnapshot runs on a cron schedule so the operator drives recurring
          backups itself. Each run is a discrete, auditable EtcdSnapshot owned by the
          policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EtcdSnapshotPolicySpec is the desired state of an EtcdSnapshotPolicy: a
              recurring schedule that stamps out EtcdSnapshot runs against one EtcdCluster.

              EtcdSnapshot is one-shot by design, which leaves every cluster's backup
              cadence to something outside the operator — an external CronJob, or nothing.
              For a parent cluster hosting many tenant control planes "or nothing" is the
              common outcome, and the first time anyone notices is during a restore. This
              puts the cadence where the cluster is.

              Deliberately the same shape as EtcdDefragPolicy (schedule, suspend,
              concurrency, starting deadline, history) — one scheduling model to learn, and
              the two share their scheduling helpers.
            properties:
              clusterRef:
                description: |-
                  ClusterRef names the EtcdCluster (same namespace) each stamped
                  EtcdSnapshot targets.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              concurrencyPolicy:
                default: Forbid
                description: |-
                  ConcurrencyPolicy decides what a due tick does when a previous stamped
                  snapshot is still running. Defaults to Forbid: a snapshot that outruns its
                  own schedule (a large keyspace on a slow link) would otherwise pile up
                  concurrent streams against the same cluster.
                enum:
                - Allow
                - Forbid
                type: string
              deleteArtifactOnPrune:
                description: |-
                  DeleteArtifactOnPrune makes history GC delete the stored snapshot along
                  with the EtcdSnapshot object it prunes, so the destination does not grow
                  without bound.

                  Off by default: deleting backups is not something to start doing because
                  a retention limit defaulted.

                  Only ever deletes the artifact recorded in the pruned EtcdSnapshot's
                  status.artifact, one object per pruned snapshot. The operator never lists
                  the destination and never deletes by prefix or age — a bucket is
                  frequently shared, and "delete everything older than N under this prefix"
                  is how a retention policy eats somebody else's backups.

                  A snapshot whose artifact cannot be deleted is kept, not silently
                  dropped: losing track of a stored object is worse than retaining one
                  EtcdSnapshot past its limit.
                type: boolean
              destination:
                description: |-
                  Destination is stamped verbatim into each EtcdSnapshot. For an S3
                  destination the key is a prefix and each stamped snapshot appends its own
                  name, so runs never overwrite one another.
                properties:
                  pvc:
                    description: PVC stores the snapshot on a PersistentVolumeClaim.
                    properties:
                      claimName:
                        description: ClaimName is the name of a PVC in the cluster's
                          namespace.
                        minLength: 1
                        type: string
                      subPath:
                        description: |-
                          SubPath means two different things depending on which side of the
                          snapshot lifecycle this location sits on — the same asymmetry S3's
                          Key field has:

                            - As a DESTINATION (EtcdSnapshot.spec.destination,
                              EtcdSnapshotPolicy.spec.destination) it is a subdirectory. The
                              agent appends its own generated filename, so consecutive runs do
                              not overwrite each other. Setting "backups" yields
                              <mount>/backups/<snapshot-name>.db.

                            - As a RESTORE SOURCE (EtcdCluster.spec.bootstrap.restore.source) it
                              is the exact path of the snapshot file within the volume, not a
                              directory: "backups/my-cluster-29558640.db". Pointing it at a
                              directory fails the restore. Take the value from the snapshot's
                              status.artifact.uri with the volume's mount path stripped.
                        type: string
                    required:
                    - claimName
                    type: object
                  s3:
                    description: S3 stores the snapshot in an S3-compatible object
                      store.
                    properties:
                      bucket:
                        description: Bucket is the destination bucket.
                        minLength: 1
                        type: string
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef references a Secret in the cluster's namespace
                          holding AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY keys.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      endpoint:
                        description: |-
                          Endpoint is the S3 endpoint URL (e.g. "https://s3.amazonaws.com" or a
                          MinIO/Ceph endpoint).
                        minLength: 1
                        type: string
                      forcePathStyle:
                        description: |-
                          ForcePathStyle selects path-style addressing (bucket in the path
                          rather than the host). MinIO/Ceph typically require true.
                        type: boolean
                      key:
                        description: |-
                          Key is an optional object-key prefix within the bucket. The operator
                          appends "<snapshot-name>.db".
                        type: string
                      region:
                        description: Region is the S3 region. Optional for endpoints
                          that ignore it.
                        type: string
                    required:
                    - bucket
                    - credentialsSecretRef
                    - endpoint
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of destination.s3 or destination.pvc must be
                    set
                  rule: has(self.s3) != has(self.pvc)
              failedHistoryLimit:
                default: 3
                description: |-
                  FailedHistoryLimit caps how many Failed EtcdSnapshots are retained.
                  Defaults to 3 — enough to see a pattern, few enough not to bury the
                  successes. Failed runs never have an artifact to prune.
                format: int32
                minimum: 0
                type: integer
              schedule:
                description: Schedule names when a snapshot is stamped.
                properties:
                  cron:
                    description: |-
                      Cron is a standard five-field cron expression (e.g. "0 3 * * *" for 03:00).
                      Descriptors (@daily) and a TZ=/CRON_TZ= prefix are rejected; use Timezone
                      for the zone.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: set the zone in schedule.timezone, not a TZ= prefix
                      rule: '!self.contains(''TZ='')'
                  timezone:
                    description: |-
                      Timezone is an IANA zone name (e.g. "Europe/Moscow") the cron expression is
                      read in. Absent reads it in UTC.
                    type: string
                required:
                - cron
                type: object
              startingDeadlineSeconds:
                description: |-
                  StartingDeadlineSeconds bounds how late a missed tick may still be
                  started. If the operator was down and more than this many seconds have
                  passed since the scheduled time, that tick is skipped rather than started
                  late. Absent means no deadline.

                  Capped at ten years for the same reason as EtcdDefragPolicy's: the value
                  is multiplied out to a time.Duration, which overflows past ~292 years and
                  wraps to a negative window that silently suppresses every tick.
                format: int64
                maximum: 315360000
                minimum: 0
                type: integer
              successfulHistoryLimit:
                default: 10
                description: |-
                  SuccessfulHistoryLimit caps how many Complete EtcdSnapshots stamped by
                  this policy are retained; the oldest beyond the limit are deleted.
                  Defaults to 10.

                  Whether pruning the object also deletes the stored snapshot it points
                  at is decided by DeleteArtifactOnPrune.
                format: int32
                minimum: 0
                type: integer
              suspend:
                description: |-
                  Suspend pauses stamping. Snapshots already in flight are left alone. On
                  resume the single most recent missed tick may be stamped (subject to
                  StartingDeadlineSeconds); earlier missed ticks are never replayed.
                type: boolean
            required:
            - clusterRef
            - destination
            - schedule
            type: object
            x-kubernetes-validations:
            - message: spec.clusterRef.name is required
              rule: size(self.clusterRef.name) != 0
          status:
            description: EtcdSnapshotPolicyStatus is the observed state of an EtcdSnapshotPolicy.
            properties:
              active:
                description: Active references the stamped EtcdSnapshots that have
                  not yet finished.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: |-
                  Conditions represent the latest observations — notably why stamping is
                  paused (Suspended) or not happening (InvalidSchedule).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastScheduleTime:
                description: |-
                  LastScheduleTime is the scheduled time of the most recent tick the policy
                  stamped a snapshot for, or consumed by skipping under ConcurrencyPolicy.
                  It anchors the next tick, so a tick is never acted on twice.
                format: date-time
                type: string
              lastSuccessfulArtifact:
                description: |-
                  LastSuccessfulArtifact records where the most recent successful snapshot
                  was stored, so a restore can be pointed at it without hunting through the
                  stamped EtcdSnapshots.
                properties:
                  checksum:
                    description: Checksum is "<algo>:<hex>", e.g. "sha256:abc123...".
                    type: string
                  sizeBytes:
                    description: SizeBytes is the snapshot size in bytes.
                    format: int64
                    type: integer
                  uri:
                    description: |-
                      URI is the full snapshot location, e.g. "s3://bucket/key.db" or
                      "file:///snapshot/data/name.db".
                    type: string
                required:
                - uri
                type: object
              lastSuccessfulTime:
                description: |-
                  LastSuccessfulTime is when a stamped snapshot most recently reached
                  Complete.

                  This is the field to alert on. "No successful backup in N hours" is the
                  question that matters, and answering it from here is one Get rather than
                  a list-and-filter over every EtcdSnapshot in the namespace.
                format: date-time
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must be 44 characters or fewer: it becomes part
            of each stamped EtcdSnapshot''s name, and of the Job name derived from
            that, which the apiserver caps at 63'
          rule: size(self.metadata.name) <= 44
    served: true
    storage: true
    subresources:
      status: {}
