{{- /*
Рендерится только для сборки манифестов через `helm template`
(build-dist-manifests выставляет namespace.create=true), чтобы голый
`kubectl apply -f etcd-operator.yaml` был самодостаточным. Настоящий
`helm install` использует --create-namespace, поэтому по умолчанию выключено.
*/ -}}
{{- if and .Values.operator.enabled (.Values.namespace.create) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
