{{- /*
Делает обязательным на границе API тот контракт, который документация несла с
первого дня: объекты EtcdMember создаёт и удаляет оператор, а не пользователи.

Удаление такого объекта — невосстановимая ошибка. Его PVC с данными принадлежит
члену как контроллеру, поэтому том — а на StorageClass с политикой Delete и
сами данные — уходит вместе с ним, а финализатор члена по пути убирает его из
etcd. Кластер, чьи члены удаляются один за другим, тем самым разбирает сам себя
и не оставляет ничего, из чего восстанавливаться.

Ничто не управляет объектами EtcdMember декларативно (единственный
санкционированный писатель, кроме оператора, — cmd/etcd-migrate, который только
создаёт и никогда не удаляет), поэтому DELETE откуда-либо ещё — это всегда либо
случайность, либо ошибка в настройке слежения; он останавливается на границе, а
запросившему сообщают причину.

Пропускаются:
  - собственный ServiceAccount оператора — scale-down и замена при crash-loop
    удаляют членов намеренно;
  - сборщик мусора — каскад от удалённого EtcdCluster обязан продолжать
    работать;
  - контроллер неймспейсов — удаление неймспейса не должно зависать;
  - сам kube-controller-manager — на кластерах без
    --use-service-account-credentials удаления от GC и при очистке неймспейса
    аутентифицируются как пользователь system:kube-controller-manager, а не как
    перечисленные выше ServiceAccount отдельных контроллеров.

Разбить стекло, не удаляя политику: пометить члена аннотацией
etcd-operator.cozystack.io/allow-deletion=true и затем удалить.

Требует Kubernetes 1.30+ (ValidatingAdmissionPolicy в GA). На более старом
apiserver установка падает с «no matches for kind ValidatingAdmissionPolicy»;
поставьте memberDeletionProtection.enabled=false, чтобы установить без защиты.

Рендерится безусловно (НЕ через .Capabilities.APIVersions): определение
возможностей сделало бы отсутствие защиты незаметным — `helm install` на версии
до 1.30 или рендер в GitOps, несущий версии API целевого кластера, тихо
пропустил бы её. Отсутствие защиты от невосстановимой ошибки должно быть
громким и явным: рендерим всегда, а отказ оформляется через
memberDeletionProtection.enabled=false.
*/ -}}
{{- if and .Values.operator.enabled (.Values.memberDeletionProtection.enabled) }}
{{- $allowed := concat
      (list
        (printf "system:serviceaccount:%s:%s" .Release.Namespace (include "etcd-operator.serviceAccountName" .))
        "system:serviceaccount:kube-system:generic-garbage-collector"
        "system:serviceaccount:kube-system:namespace-controller"
        "system:kube-controller-manager")
      .Values.memberDeletionProtection.additionalAllowedUsers }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "etcd-operator.fullname" . }}-protect-members
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["etcd-operator.cozystack.io"]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["etcdmembers"]
  validations:
    - expression: >-
        request.userInfo.username in {{ $allowed | toJson }}
        || (has(oldObject.metadata.annotations)
            && "etcd-operator.cozystack.io/allow-deletion" in oldObject.metadata.annotations
            && oldObject.metadata.annotations["etcd-operator.cozystack.io/allow-deletion"] == "true")
      reason: Forbidden
      messageExpression: >-
        "EtcdMember " + oldObject.metadata.name + " is managed exclusively by etcd-operator, and deleting it
        removes the member from etcd and releases its data volume — the data is not recoverable from here.
        Scale the EtcdCluster instead. If you really mean it, annotate the member with
        etcd-operator.cozystack.io/allow-deletion=true first."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "etcd-operator.fullname" . }}-protect-members
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "etcd-operator.fullname" . }}-protect-members
  validationActions: ["Deny"]
{{- with .Values.manager.watchNamespaces }}
  # Ограничиваем отслеживаемыми неймспейсами, чтобы несколько релизов,
  # ограниченных неймспейсами, не запрещали членов друг друга (при допуске
  # побеждает запрет, а в списке разрешённых у каждого только его собственный SA
  # оператора). Установка на весь кластер обязана быть единственной — см.
  # values.yaml.
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}
