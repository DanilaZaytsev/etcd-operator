{{- /*
CRD, отрендеренные шаблонами, а не через каталог crds/ (который Helm применяет
только при установке), чтобы `helm upgrade` держал их в соответствии с релизом.
Исходные CRD, сгенерированные controller-gen, лежат в crd-bases/ (их пишет
`make manifests`, а сторожит codegen-drift гейт в ci.yml); каждый прогоняется
через fromYaml/toYaml, чтобы вставить аннотацию helm.sh/resource-policy:keep,
которая не даёт `helm uninstall` удалить CRD — иначе каскадом удалился бы
каждый EtcdCluster вместе с данными.
*/ -}}
{{- if and .Values.operator.enabled (.Values.crds.enabled) }}
{{- range $path, $_ := .Files.Glob "crd-bases/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- if $.Values.crds.keep }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") (default (dict) $crd.metadata.annotations)) }}
{{- end }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
