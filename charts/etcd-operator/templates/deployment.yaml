{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "etcd-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "etcd-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "etcd-operator.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "etcd-operator.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        # Требуется профилем PodSecurity `restricted`. Без него собственный под
        # оператора отклоняется в неймспейсе, где restricted принудителен, —
        # притом что поды членов etcd, которые выпускает оператор, ему уже
        # соответствуют. Переопределяемо для кластеров с профилем Localhost.
        {{- with .Values.manager.seccompProfile }}
        seccompProfile:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: manager
        image: {{ include "etcd-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --health-probe-bind-address=:8081
        {{- if .Values.kubeRbacProxy.enabled }}
        - --metrics-bind-address=127.0.0.1:8080
        {{- else }}
        - --metrics-bind-address=:8080
        {{- end }}
        - --leader-elect
        {{- with .Values.manager.clusterDomain }}
        - --cluster-domain={{ . }}
        {{- end }}
        {{- if gt (int .Values.manager.maxConcurrentReconciles) 1 }}
        - --max-concurrent-reconciles={{ int .Values.manager.maxConcurrentReconciles }}
        {{- end }}
        env:
        # ОБЯЗАН совпадать с образом менеджера: оператор запускает эту ссылку
        # для Job снапшотов и init-контейнеров восстановления и отказывается
        # стартовать, если здесь осталась заглушка.
        - name: OPERATOR_IMAGE
          value: {{ include "etcd-operator.image" . }}
        # Общеоператорское умолчание репозитория образа etcd для подов членов.
        # Задаётся всегда, поэтому встроенный запасной вариант оператора
        # достижим, только когда бинарь запущен вне этого чарта. Перенаправляйте
        # сюда на зеркало в закрытом контуре; тег всегда v<spec.version>.
        - name: ETCD_IMAGE_REPOSITORY
          value: {{ .Values.etcdImage.repository | quote }}
        {{- with .Values.manager.watchNamespaces }}
        - name: WATCH_NAMESPACE
          value: {{ if kindIs "slice" . }}{{ join "," . | quote }}{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
        {{- if not .Values.kubeRbacProxy.enabled }}
        # Когда прокси впереди нет, менеджер сам слушает метрики на :8080.
        # Объявленный порт — это то, что позволяет Service метрик указать на него
        # по имени.
        ports:
        - containerPort: 8080
          protocol: TCP
          name: metrics
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          # Менеджер ничего не пишет на диск: запись есть только в
          # internal/agent, а он выполняется в контейнерах Job'ов снапшота и
          # восстановления и пишет в смонтированные тома, не в корневую ФС.
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        resources:
          {{- toYaml .Values.manager.resources | nindent 10 }}
      {{- if .Values.kubeRbacProxy.enabled }}
      - name: kube-rbac-proxy
        image: {{ .Values.kubeRbacProxy.image.repository }}:{{ .Values.kubeRbacProxy.image.tag }}
        imagePullPolicy: {{ .Values.kubeRbacProxy.image.pullPolicy }}
        args:
        - --secure-listen-address=0.0.0.0:8443
        - --upstream=http://127.0.0.1:8080/
        - --logtostderr=true
        - --v=0
        ports:
        - containerPort: 8443
          protocol: TCP
          name: https
        securityContext:
          allowPrivilegeEscalation: false
          # Прокси только терминирует TLS и проксирует в 127.0.0.1 — на диск
          # не пишет.
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        resources:
          {{- toYaml .Values.kubeRbacProxy.resources | nindent 10 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if and .Values.defaultAntiAffinity (gt (int .Values.replicaCount) 1) }}
      # Две резервные реплики на одной ноде не дают никакого переключения,
      # когда эта нода уходит. Предпочтительная, а не обязательная, чтобы на
      # одноузловом или небольшом кластере они всё же разместились.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "etcd-operator.selectorLabels" . | nindent 18 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
